name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or gap you've noticed.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see built?
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this fit?
      options:
        - Phase 1 (Schedule / Gallery / UI)
        - Phase 2 (Admin / Submissions / Supabase)
        - Phase 3 (Community / Live Scores / Auth)
        - New phase

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
